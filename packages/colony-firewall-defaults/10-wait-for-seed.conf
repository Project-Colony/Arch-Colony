# Drop-in for colony-firewall-nft.service.
#
# Upstream's unit already refuses to load the table when the daemon is not
# running. This adds the other half: it must not load it when the rules are not
# in either. Without this, a seeding failure leaves a fail-closed chain with an
# empty rule set — the daemon is up, so the ExecStartPre guard passes, and every
# outbound connection is dropped until someone answers a prompt on a machine
# that can no longer reach anything.
#
# A drop-in rather than a patch: the unit belongs to colony-firewall-control,
# this is Arch Colony's policy about when it may run, and the two should be able
# to move independently (ADR-0007).

[Unit]
Requires=colony-firewall-seed.service
After=colony-firewall-seed.service
