
# Arch Colony's own repository.
#
# Enabled on 2026-08-21, once the release it points at actually existed and was
# proven to serve. It was commented out until then for a reason worth keeping in
# view: pacman -Sy fails outright when any configured repository cannot be
# synchronised, so declaring an unpublished one does not merely fail to deliver
# updates — it breaks every `pacman -Syu` on the machine, and it broke
# installation itself, because the packages module runs `pacman -Sy` in the
# target before installing anything.
#
# What had to be true before uncommenting these two lines, and was verified
# rather than assumed:
#
#   - repo/publish.sh actually publishes. It never had: it died materialising
#     colony.db.sig onto itself, and then on duplicate asset names. Both fixed.
#   - the release serves over plain HTTPS with no authentication — 24 assets,
#     HTTP 200, checked by URL and not by looking at the web page.
#   - an isolated pacman root with its own empty keyring can sync this database,
#     verify its signature, install a package from it and verify that too, with
#     SigLevel = Required DatabaseRequired. See tools/test-published-repo.sh.
#
# If this repository is ever taken down, comment these lines out and bump
# colony-mirrorlist's pkgrel before anyone runs pacman -Syu.

[colony]
Include = /etc/pacman.d/colony-mirrorlist
