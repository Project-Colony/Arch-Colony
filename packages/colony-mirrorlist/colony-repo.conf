
# Arch Colony's own repository.
#
# Enabled on 2026-08-21, once the release it points at actually existed and was
# proven to serve. It was commented out until then for a reason worth keeping in
# view: pacman -Sy fails outright when any configured repository cannot be
# synchronised, so declaring an unpublished one does not merely fail to deliver
# updates - it breaks every `pacman -Syu` on the machine, and it broke
# installation itself, because the packages module runs `pacman -Sy` in the
# target before installing anything.
#
# What had to be true before this stanza was enabled, and was verified rather
# than assumed:
#
#   - repo/publish.sh actually publishes. It never had: it died materialising
#     colony.db.sig onto itself, and then on duplicate asset names. Both fixed.
#   - the release serves over plain HTTPS with no authentication - 24 assets,
#     HTTP 200, checked by URL and not by looking at the web page.
#   - an isolated pacman root with its own empty keyring can sync this database,
#     verify its signature, install a package from it and verify that too, with
#     SigLevel = Required DatabaseRequired. See tools/test-published-repo.sh.
#
# SigLevel is set here rather than inherited. The [options] default in the
# pacman.conf that `pacman` ships is "Required DatabaseOptional", under which a
# colony.db that arrives without colony.db.sig is accepted as it is. Whoever
# controls this server, or the path to it, could then hand a machine a database
# of their own that simply never offers the next fix. DatabaseRequired refuses
# a database that is unsigned or signed by a key pacman does not trust, and
# tools/test-repo.sh syncs through this exact stanza to check both. It does not
# refuse an older database that was genuinely signed: pacman has no expiry for
# those.
#
# Machines installed before the line existed hold a copy of the stanza without
# it. colony-mirrorlist.install adds it there on upgrade.
#
# Moving or retiring this repository. The installer copies this stanza into
# /etc/pacman.conf, so a new colony-mirrorlist only changes the reference copy
# under /usr/share/colony/pacman and reaches no installed machine. Editing this
# file can neither move [colony] nor take it down. What installed machines do
# receive is /etc/pacman.d/colony-mirrorlist, so a move goes through that file:
#
#   1. Publish the repository at its new location while the `repo` release
#      keeps serving the same signed database.
#   2. Release colony-mirrorlist with the new Server first and the old one after
#      it. The file is in backup=, so a machine whose copy was edited by hand
#      gets a .pacnew instead and stays on the old Server until its owner merges
#      it.
#   3. Keep the `repo` release serving through an overlap window long enough for
#      those machines and for the ones that update rarely. Deleting it first
#      breaks their pacman -Syu, for the reason given at the top of this file.
#
# Retiring [colony] outright needs the same overlap: the stanza can only leave
# /etc/pacman.conf through a colony-mirrorlist scriptlet, and the old location
# has to keep serving until that release has reached everyone.

[colony]
SigLevel = Required DatabaseRequired
Include = /etc/pacman.d/colony-mirrorlist
