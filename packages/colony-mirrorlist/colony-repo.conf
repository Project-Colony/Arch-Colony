
# Arch Colony's own repository.
#
# Commented out on purpose: the release it points at does not exist yet
# (HTTP 404, `gh release view repo` says "release not found"). pacman -Sy fails
# outright when any configured repository cannot be synchronised, so declaring an
# unpublished one does not merely fail to deliver updates — it breaks every
# `pacman -Syu` on the machine, and it broke installation itself, because the
# packages module runs `pacman -Sy` in the target before installing anything.
#
# Nothing is lost by leaving it off today: the installer offers packages from
# core and extra only, and Colony's own software reaches the machine through the
# filesystem copy rather than through this repository.
#
# To enable, once repo/publish.sh has actually published a release: uncomment the
# two lines below, bump colony-mirrorlist's pkgrel, and rebuild.
#
#[colony]
#Include = /etc/pacman.d/colony-mirrorlist
