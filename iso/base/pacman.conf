#
# Build-time pacman configuration for the Arch Colony base image.
#
# [colony] is declared before [core] the same way it will be on an installed
# system. The position does not shadow anything — ADR-0002 forbids [colony] from
# carrying the name of any package in core, extra or multilib, and
# tools/check-shadowing.sh enforces it.
#
# @COLONY_REPO@ is substituted by iso/build.sh with the absolute path to
# repo/out, because a file:// URL cannot be relative and the path differs per
# machine. Once the repository is published, this becomes the real Server line.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[colony]
SigLevel = Required DatabaseRequired
Server = file://@COLONY_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
