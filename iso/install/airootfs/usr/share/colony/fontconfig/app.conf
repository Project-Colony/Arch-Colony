<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The installer's font, and the only place it is named (TYP-2): JetBrainsMono
  Nerd Font, from colony-fonts. colony-live-setup points FONTCONFIG_FILE at this
  file, or at dyslexic.conf next to it when the boot entry asks for
  colony.font=dyslexic, and Calamares, its painted step list, its stylesheet and
  its slideshow all ask fontconfig for the generic families below rather than
  for a font by name. The system's own configuration is read first, unchanged.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Sans Serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
