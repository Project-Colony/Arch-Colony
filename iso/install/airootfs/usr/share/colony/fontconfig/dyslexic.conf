<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  OpenDyslexic in place of the installer's font, everywhere at once: what the
  boot entries' colony.font=dyslexic selects. See app.conf next to this file.
  The log view keeps JetBrainsMono Nerd Font, whose fixed width its columns of
  paths and package names need.
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>OpenDyslexic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Sans Serif</family>
    <prefer><family>OpenDyslexic</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
