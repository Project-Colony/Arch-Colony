# pacman configuration for one job: installing Colony Firewall Control into the
# machine being installed, from this medium, with or without a network.
#
# The installer's cleanup step (shellprocess_cleanup.conf) reads it inside the
# target, where unpackfs has copied this directory, and removes the directory
# and the colony-offline sync database once the firewall is in. iso/build.sh
# fills it at build time through iso/offline-repo.sh: colony-firewall-defaults,
# colony-firewall-control and colony-firewall-control-ebpf with the signatures
# repo/build.sh made, and a colony-offline database signed with the Colony key.
#
# Without it an offline install shipped no firewall at all: the firewall came
# only from [colony], over the network, while systemd-networkd and resolved are
# enabled on every target.
#
# The live session itself never installs from here, and must not. A live
# medium that enabled the firewall would hand the installer a fail-closed table
# and no network to finish the install with, which is why the firewall goes to
# the target only.
#
# Everything has to verify: the database and every package carry a Colony
# signature, checked against the keyring the same step populates in the target
# just before.

[options]
Architecture = auto
SigLevel = Required DatabaseRequired
LocalFileSigLevel = Required

[colony-offline]
SigLevel = Required DatabaseRequired
Server = file:///usr/share/colony/offline-repo
