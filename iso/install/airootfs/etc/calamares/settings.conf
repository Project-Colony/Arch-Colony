# Arch Colony installer sequence.
#
# Module defaults live in /usr/share/calamares/modules/; only the files that need
# Colony-specific values are overridden under /etc/calamares/modules/. Note that an
# override REPLACES the upstream file rather than merging with it, so each override
# must restate everything upstream set that we still need.
#
# Colony branding carries strings and the logo but no colours — see the comment in
# branding/colony/branding.desc.in. Leaving Calamares' "default" branding was tried and
# is not acceptable: it announces "Fancy GNU/Linux 2023.3 LTS Venomous Vole" to the
# user, which is worse than an unstyled but honest installer.

modules-search: [ local ]

instances:
- id: preflight
  module: shellprocess
  config: shellprocess_preflight.conf
- id: verify
  module: shellprocess
  config: shellprocess_verify.conf
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id: resolv
  module: shellprocess
  config: shellprocess_resolv.conf
- id: services
  module: shellprocess
  config: shellprocess_services.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  # Optional extra software, from Arch's repositories only. Contributes to the
  # global packageOperations that the `packages` exec module performs, which is
  # why netinstall appears here but not in the exec list.
  - netinstall
  - users
  - summary
- exec:
  # BEFORE partition, and that ordering is the whole point. `partition` formats,
  # so every check that runs after it can only report a disk that is already
  # gone. This one refuses to start when the medium does not carry the squashfs
  # the install is copied from — the failure a Rufus "ISO mode" USB produces,
  # which cost someone their partition table on 2026-08-22.
  - shellprocess@preflight
  - partition
  - mount
  - unpackfs
  # Must come straight after unpackfs and before anything that reads the target's
  # configuration: it removes the live session's files and repairs /boot and the
  # mkinitcpio preset, both of which mkarchiso strips or replaces. Without it the
  # install fails at initcpio, and anything that did complete would boot into the
  # live environment's autologin.
  - shellprocess@cleanup
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  # After networkcfg, which recreates the dead resolv.conf symlink, and before
  # packages, which is the first module to need DNS inside the target.
  - shellprocess@resolv
  - hwclock
  - initcpiocfg
  - initcpio
  - bootloader
  # Installs whatever the package page selected, and removes the installer.
  - packages
  # After packages, because it configures whichever greeter the chosen desktop
  # profile just pulled in. Before packages it would find nothing to configure.
  - displaymanager
  # displaymanager writes configuration but enables nothing — it hands a
  # "displayManagers" key to a services-systemd module that cannot act on a
  # runtime choice. This does the enabling, for the greeter and for the network
  # manager the desktop dragged in.
  - shellprocess@services
  # After the greeters are enabled, because it checks what that left behind: a
  # machine with a desktop and no login screen boots to a console and looks
  # broken. Repairs it if a greeter is on the disk, refuses to finish if none is.
  - shellprocess@verify
  - umount
- show:
  - finished

branding: colony

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
