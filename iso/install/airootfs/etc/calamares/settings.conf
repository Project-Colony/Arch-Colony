# Arch Colony installer sequence.
#
# Module defaults live in /usr/share/calamares/modules/; only the files that need
# Colony-specific values are overridden under /etc/calamares/modules/. Note that an
# override REPLACES the upstream file rather than merging with it, so each override
# must restate everything upstream set that we still need.
#
# Colony branding carries strings and the logo but no colours — see the comment in
# branding/colony/branding.desc.in. Leaving Calamares' "default" branding was tried and
# is not acceptable: it announces "Fancy GNU/Linux 2023.3 LTS Venomous Vole" to the
# user, which is worse than an unstyled but honest installer.

modules-search: [ local ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  # Must come straight after unpackfs and before anything that reads the target's
  # configuration: it removes the live session's files and repairs /boot and the
  # mkinitcpio preset, both of which mkarchiso strips or replaces. Without it the
  # install fails at initcpio, and anything that did complete would boot into the
  # live environment's autologin.
  - shellprocess@cleanup
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - initcpiocfg
  - initcpio
  - bootloader
  - packages
  - umount
- show:
  - finished

branding: colony

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
