# Arch Colony installer sequence.
#
# Module defaults live in /usr/share/calamares/modules/; only the files that need
# Colony-specific values are overridden under /etc/calamares/modules/.
#
# Colony branding carries strings and the logo but no colours — see the comment in
# branding/colony/branding.desc. Leaving Calamares' "default" branding was tried and
# is not acceptable: it announces "Fancy GNU/Linux 2023.3 LTS Venomous Vole" to the
# user, which is worse than an unstyled but honest installer.

modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - initcpiocfg
  - initcpio
  - bootloader
  - packages
  - umount
- show:
  - finished

branding: colony

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
