# Arch Colony installer sequence.
#
# Module defaults live in /usr/share/calamares/modules/; only the files that need
# Colony-specific values are overridden under /etc/calamares/modules/.
#
# branding is "default" on purpose. Colony branding belongs to the token system
# (principe 4) and the colony-tokens generator has no Calamares target yet — that
# is J3 work. A hand-written branding directory here would be exactly the
# hardcoded-colour duplication Project-Colony-Resources exists to prevent.

modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - initcpiocfg
  - initcpio
  - bootloader
  - packages
  - umount
- show:
  - finished

branding: default

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
