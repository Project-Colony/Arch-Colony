# Runs FIRST, before `partition`, and its only job is to refuse to start an
# installation that cannot finish.
#
# On 2026-08-22 a real machine was partitioned and formatted, and the install
# then died in unpackfs with:
#
#     Le système de fichiers source "/run/archiso/bootmnt/colony/x86_64/airootfs.sfs"
#     n'existe pas
#
# The image was fine. The USB had been written by Rufus in "ISO" mode, which
# extracts the files onto a partition of its own making instead of copying the
# image byte for byte, so archisosearchuuid finds nothing that matches and
# /run/archiso/bootmnt is not the medium. archiso boots anyway - the kernel is
# there - and Calamares reaches unpackfs before anyone finds out.
#
# By then the disk is gone. `partition` is the first exec module and it formats.
# Everything after it can only discover, too late, that it should never have run.
#
# So: check the one file the whole installation is copied from, before touching
# a single partition table. A user who wrote their medium the wrong way now gets
# a message on an untouched disk instead of an empty one.
---
dontChroot: true
timeout: 30

script:
  # No "-" prefix. This one MUST fail the installation - that is the point.
  # Calamares aborts the sequence on a non-zero exit, and here that is a feature.
  # The message matters as much as the exit code: whoever sees this needs to
  # know it is their medium and not their disk, and what to do about it, in
  # their language, so it is a script reading the live session's string table.
  # It also keeps shell variables out of this file - Calamares substitutes $name
  # before the shell sees the string, and an unknown one aborts the install for
  # the wrong reason.
  - command: "/usr/local/bin/colony-preflight"
    timeout: 20
