# The package selection page.
#
# groupsUrl points at a file that iso/build.sh GENERATES at build time with
# tools/gen-netinstall.py — it is not in git. It carries three sections:
#
#   Bureaux             20 desktop profiles, derived from archinstall
#   Pilotes graphiques  6 driver sets, derived from archinstall
#   Dépôts              every package in core, extra and multilib (>15000)
#
# The full repository listing is only usable because the calamares package in
# [colony] carries a downstream patch adding a search box to netinstall — see
# packages/calamares/0001-netinstall-add-a-search-filter.patch. Without it this
# page would be fifteen thousand rows with no way to find anything.
#
# required: false is load-bearing. netinstall downloads, so it needs network,
# while the rest of the install is a filesystem copy that works offline. The
# installer asks for network permission before anything reaches out, so a user
# who declines simply gets nothing from this page and installs anyway.
#
# Nothing is preselected. An installer that ticks boxes on the user's behalf is
# how a distribution ends up shipping software nobody asked for.
---
groupsUrl: file:///etc/calamares/modules/netinstall.yaml
required: false

# The plain keys must stay ASCII. They go through Calamares' translation lookup,
# which does not read them as UTF-8 — "Logiciels supplémentaires" rendered as
# "Logiciels suppl<?>mentaires" on screen. Accented text belongs in a [ll]
# variant, which is read correctly.
label:
    sidebar:     "Software"
    sidebar[fr]: "Logiciels"
    title:       "Desktop, drivers and software"
    title[fr]:   "Bureau, pilotes et logiciels"
