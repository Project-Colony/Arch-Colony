# Optional package selection, the equivalent of archinstall's package step.
#
# Every package below is from Arch's own repositories and every name was verified
# to resolve on 2026-08-20. Deliberately nothing from [colony]: that repository
# points at a GitHub release which does not exist yet, so netinstall could not fetch
# from it. Colony's own software reaches the installed system through unpackfs
# instead — paru included, which is why it is in packages.x86_64 rather than here.
#
# required: false is load-bearing. netinstall downloads, so it needs network, while
# the rest of the install is a filesystem copy that works offline. A machine with no
# network must still be able to install; it simply gets nothing from this page.
#
# Nothing is preselected. An installer that ticks boxes on the user's behalf is how
# a distribution ends up shipping software nobody asked for.
---
groupsUrl: local
required: false

label:
    sidebar: "Logiciels"
    title:   "Logiciels supplémentaires"

groups:
  - name: "Navigateurs"
    description: "Navigateurs web"
    selected: false
    hidden: false
    packages:
      - firefox
      - chromium

  - name: "Multimédia"
    description: "Lecture audio et vidéo"
    selected: false
    hidden: false
    packages:
      - vlc
      - mpv
      - ffmpeg

  - name: "Bureautique"
    description: "Suite bureautique et courrier"
    selected: false
    hidden: false
    packages:
      - libreoffice-fresh
      - thunderbird

  - name: "Développement"
    description: "Outils de compilation et éditeurs"
    selected: false
    hidden: false
