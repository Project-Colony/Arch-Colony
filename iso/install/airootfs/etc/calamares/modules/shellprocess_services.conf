# Enable the services the chosen packages need. Runs AFTER packages, because
# until then none of them are installed.
#
# Calamares' displaymanager module does NOT do this. It writes the greeter's
# configuration and puts a "displayManagers" key in global storage for a
# services-systemd module to consume — and services-systemd only reads a static
# `units:` list from its own config, so it cannot act on a greeter the user picked
# at runtime. Without this step, choosing GNOME or Plasma yields an install that
# reports success and then boots to a text console.
#
# NO SHELL VARIABLES: Calamares substitutes $name itself before the shell sees the
# string, and an unknown name aborts the installation. An earlier version of this
# file looped with `for u in sddm gdm …` and would have died the same way
# shellprocess@resolv did. Hence one command per greeter rather than a loop, each
# prefixed with "-" so a missing unit is ignored.
#
# Enabled in REVERSE order of preference, and --force is what makes that true.
#
# An earlier version of this comment claimed `systemctl enable` on a display
# manager rewrites the display-manager.service alias so the last one wins. It
# does the opposite. Every greeter here declares Alias=display-manager.service,
# and systemd refuses to clobber an alias that already exists:
#
#   enable first           Created symlink display-manager.service -> first
#   enable second          Failed to enable unit: File 'display-manager.service'
#                          already exists and is a symlink to first.service
#   enable second --force  Removed ... Created symlink ... -> second
#
# So the FIRST one won, and the six after it failed silently — the "-" prefix
# that makes a missing unit harmless also swallowed this. Someone who picked
# COSMIC and Hyprland got greetd, whose stock config is
# `agreety --cmd /bin/sh`: a TEXT greeter on vt1, with Conflicts=getty@tty1, so
# the machine booted to what looks exactly like a plain console login and drops
# into /bin/sh instead of the user's shell. Reported from a real install, and it
# took three symptoms to see it was one bug.
#
# With --force each successful enable overwrites, and last-wins holds as written:
# sddm last and most preferred, greetd first and least — which is right, since
# greetd's default session is not graphical at all.
---
dontChroot: true
timeout: 120

script:
  - "-arch-chroot ${ROOT} systemctl enable --force greetd"
  - "-arch-chroot ${ROOT} systemctl enable --force ly@tty1"
  - "-arch-chroot ${ROOT} systemctl enable --force lightdm"
  - "-arch-chroot ${ROOT} systemctl enable --force cosmic-greeter"
  - "-arch-chroot ${ROOT} systemctl enable --force gdm"
  - "-arch-chroot ${ROOT} systemctl enable --force plasmalogin"
  - "-arch-chroot ${ROOT} systemctl enable --force sddm"

  # Two things archinstall's install_greeter() does that enabling a unit does
  # not, both conditional on the greeter actually being installed.
  #
  # ly takes vt1, so archinstall pairs `enable ly@tty1` with
  # `disable getty@tty1`. Doing that unconditionally would take the console
  # login away from every machine that did not choose ly, so it is guarded on
  # the unit file existing — the same shape the NetworkManager line below uses.
  - "-/bin/sh -c 'arch-chroot ${ROOT} test -f /usr/lib/systemd/system/ly.service && arch-chroot ${ROOT} systemctl disable getty@tty1'"
  # slick-greeter is a lightdm *theme*: installing it changes nothing until
  # lightdm.conf names it, so without this line picking slick silently gives
  # the GTK greeter. archinstall patches the same commented line.
  - "-/bin/sh -c 'arch-chroot ${ROOT} test -f /usr/share/xgreeters/lightdm-slick-greeter.desktop && arch-chroot ${ROOT} sed -i s/#greeter-session=example-gtk-gnome/greeter-session=lightdm-slick-greeter/ /etc/lightdm/lightdm.conf'"

  # NetworkManager is not optional for some desktops — plasma-meta pulls it in
  # through plasma-nm, a hard dependency chain. It has no pacman preset and no
  # D-Bus activation file, so it arrives installed and disabled: the tray applet
  # is present and permanently dead. Where it exists it takes over, and networkd
  # steps aside rather than leaving two managers fighting over the same links.
  - "-/bin/sh -c 'arch-chroot ${ROOT} test -f /usr/lib/systemd/system/NetworkManager.service && arch-chroot ${ROOT} systemctl disable systemd-networkd systemd-resolved && arch-chroot ${ROOT} systemctl enable NetworkManager'"

  # Wi-Fi. systemd-networkd does not speak WPA, so a wireless machine with only
  # networkd enabled waits forever for a link nothing will bring up. iwd is
  # already in the image; enabling it costs nothing on a wired machine.
  - "-arch-chroot ${ROOT} systemctl enable iwd"
