# Enable the services the chosen packages need. Runs AFTER packages, because
# until then none of them are installed.
#
# Calamares' displaymanager module does NOT do this. It writes the greeter's
# configuration and puts a "displayManagers" key in global storage for a
# services-systemd module to consume — and services-systemd only reads a static
# `units:` list from its own config, so it cannot act on a greeter the user picked
# at runtime. Without this step, choosing GNOME or Plasma yields an install that
# reports success and then boots to a text console.
---
dontChroot: true
timeout: 120

script:
  # The first greeter that is actually present wins. The order matches
  # displaymanager.conf, plus the two Calamares does not know about:
  # plasma-login-manager, which plasma-meta pulls in, and cosmic-greeter.
  - "/bin/sh -c 'for u in sddm plasmalogin gdm cosmic-greeter lightdm ly@tty1 greetd; do if arch-chroot ${ROOT} systemctl list-unit-files \"$u.service\" >/dev/null 2>&1 && arch-chroot ${ROOT} systemctl enable \"$u\" >/dev/null 2>&1; then echo \"greeter enabled: $u\"; break; fi; done'"

  # NetworkManager is not optional for some desktops — plasma-meta pulls it in
  # through plasma-nm, a hard dependency chain. It has no pacman preset and no
  # D-Bus activation file, so it arrives installed and disabled: the tray applet
  # is present and permanently dead. Where it exists it takes over, and networkd
  # steps aside rather than leaving two managers fighting over the same links.
  - "/bin/sh -c 'if arch-chroot ${ROOT} systemctl list-unit-files NetworkManager.service >/dev/null 2>&1; then arch-chroot ${ROOT} systemctl disable systemd-networkd systemd-resolved >/dev/null 2>&1 || :; arch-chroot ${ROOT} systemctl enable NetworkManager >/dev/null 2>&1 || :; echo \"NetworkManager enabled, systemd-networkd disabled\"; fi'"

  # Wi-Fi. systemd-networkd does not speak WPA, so a wireless machine with only
  # networkd enabled waits forever for a link nothing will bring up. iwd is
  # already in the image; enabling it costs nothing on a wired machine.
  - "/bin/sh -c 'arch-chroot ${ROOT} systemctl enable iwd >/dev/null 2>&1 || :'"
