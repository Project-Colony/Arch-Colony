# The last thing that runs before unmounting, and the only one allowed to say
# "this install is not finishable".
#
# Calamares cannot ask a shellprocess what the user ticked — netinstall's
# selections live in global storage, which only a compiled module reads. So
# there is no way to warn before `partition` that a required box is unticked.
# What is possible is to inspect the RESULT, repair what can be repaired, and
# refuse to report success on something that would reboot into a login: prompt.
#
# No "-" prefix, deliberately. Every other command in this installer is
# prefixed so a missing unit cannot kill an install; this one must be able to.
---
dontChroot: true
timeout: 60

script:
  - command: "/usr/local/bin/colony-verify-session ${ROOT}"
    timeout: 60
