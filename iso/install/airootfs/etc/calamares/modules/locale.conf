# Without this file Calamares uses its upstream default, which performs a GeoIP
# lookup against geoip.kde.org. That happens at module load — locale/Config.cpp
# wires startGeoIP to ModuleManager::modulesLoaded, not to the page being opened —
# so a machine whose user allowed the network reaches out before the Location page
# is ever shown, and before anything told them it would. The boot prompt says the
# network is only needed for extra software; this makes that true.
#
# Setting region and zone is not optional once geoip is off: upstream's defaults
# are America/New_York, so disabling the lookup without them would silently put
# every installation in New York. These are only the initial selection — the
# Location page lets the user change both.
---
region: "Europe"
zone:   "Paris"

geoip:
    style: none
