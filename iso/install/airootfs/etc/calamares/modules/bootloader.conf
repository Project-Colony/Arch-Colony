# A file under /etc/calamares/modules REPLACES the upstream one, it does not merge
# (Module.cpp: first match wins, whole assignment). So everything upstream sets and
# we still need must be restated here, not just our deltas.
#
# An earlier version of this file declared kernel:, img:, fallback: and timeout:.
# None of those keys exist in Calamares 3.4.2 — bootloader.schema.yaml has
# additionalProperties: false and does not list them, and main.py never reads them.
# They were dead, and the comment claiming they were load-bearing was wrong. Kernels
# are discovered by walking kernelSearchPath.
#
# Pinned against calamares 3.4.2. Re-check the schema when that version changes.
---
efiBootLoader:   "systemd-boot"
efiBootloaderId: "archcolony"
efiBootMgr:      "efibootmgr"

kernelSearchPath: "/usr/lib/modules"
kernelPattern:    "^vmlinuz.*"

# Restored from upstream. Dropping it makes create_loader() fall into its KeyError
# branch and write a loader.conf with no timeout at all — systemd-boot then boots the
# default entry with no menu, which leaves no way out if that entry is broken.
loaderEntries:
  - "timeout 5"
  - "console-mode keep"

kernelParams: [ "rw" ]

installEFIFallback: true
