# Kernel image names follow linux-hardened (ADR-0004), not linux. Getting these
# wrong produces an installed system that completes without error and then fails
# to boot.
---
efiBootLoader: "systemd-boot"
kernel: "/vmlinuz-linux-hardened"
img: "/initramfs-linux-hardened.img"
fallback: "/initramfs-linux-hardened-fallback.img"
timeout: "5"
bootloaderEntryName: "Arch Colony"
kernelParams: [ "rw" ]
efiBootloaderId: "archcolony"
installEFIFallback: true
