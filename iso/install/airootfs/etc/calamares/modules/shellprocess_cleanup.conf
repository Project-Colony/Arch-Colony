# Turns the copied live filesystem into an installed system.
#
# unpackfs copies the live root wholesale, so without this step every installed
# machine inherits the live environment: passwordless root autologin on tty1, a
# .zlogin that downloads and executes whatever URL was passed as script= on the
# kernel command line, sshd enabled with PermitRootLogin, a pacman keyring on tmpfs
# that is destroyed at every boot, and no persistent journal. None of that belongs
# on a machine someone installs.
#
# It also repairs two things mkarchiso removes or replaces:
#
#   - /boot is EMPTY in the squashfs. mkarchiso deletes it before building the image,
#     because the kernel lives on the ISO 9660 side instead. Copied as-is, the
#     installed system has no kernel image and mkinitcpio fails with "specified
#     kernel image does not exist".
#   - the mkinitcpio preset under /etc is archiso's, PRESETS=('archiso'), pointing at
#     a path that does not exist on disk and forcing -c archiso.conf, which makes the
#     mkinitcpio.conf written by initcpiocfg unreadable. The correct preset is
#     restored from colony-mkinitcpio's reference copy under /usr/share, which
#     archiso's overlay does not touch.
#
# Variable syntax is ${ROOT}, per the module's own documentation. An earlier version
# used @@ROOT@@, which is not a thing: the shell took it literally, `install -D`
# happily created a directory actually named @@ROOT@@ in the live filesystem, `rm -f`
# ignored the missing paths, and the mistake only surfaced three commands later on a
# redirect — which does not create its parent. Nothing reached the target.
#
# Runs OUTSIDE the chroot (dontChroot: true) because it needs /run/archiso/bootmnt,
# which is not visible from inside the target.
---
dontChroot: true
timeout: 300

script:
  # --- kernel: recover what mkarchiso stripped -------------------------------
  - "install -Dm644 /run/archiso/bootmnt/colony/boot/x86_64/vmlinuz-linux-hardened ${ROOT}/boot/vmlinuz-linux-hardened"

  # --- mkinitcpio: drop archiso's, restore the packaged preset ---------------
  - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
  - "rm -f ${ROOT}/etc/mkinitcpio.d/linux.preset"
  - "install -Dm644 ${ROOT}/usr/share/colony/mkinitcpio/linux-hardened.preset ${ROOT}/etc/mkinitcpio.d/linux-hardened.preset"

  # --- the live session must not survive -------------------------------------
  - "rm -rf ${ROOT}/etc/systemd/system/getty@tty1.service.d"
  - "rm -f ${ROOT}/root/.zlogin ${ROOT}/root/.automated_script.sh"
  - "rm -f ${ROOT}/etc/ssh/sshd_config.d/10-archiso.conf"
  - "rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/sshd.service"
  - "rm -f ${ROOT}/etc/systemd/system/pacman-init.service"
  - "rm -f ${ROOT}/etc/systemd/system/etc-pacman.d-gnupg.mount"
  - "rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/pacman-init.service"
  - "rm -f ${ROOT}/etc/systemd/system/sysinit.target.wants/etc-pacman.d-gnupg.mount"
  - "rm -f ${ROOT}/etc/systemd/journald.conf.d/volatile-storage.conf"
  - "rm -f ${ROOT}/etc/systemd/logind.conf.d/do-not-suspend.conf"
  - "rm -f ${ROOT}/etc/systemd/system/choose-mirror.service"
  - "rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/choose-mirror.service"
  - "rm -f ${ROOT}/etc/systemd/system/livecd-alsa-unmuter.service ${ROOT}/etc/systemd/system/livecd-talk.service"
  - "rm -f ${ROOT}/etc/systemd/system/multi-user.target.wants/livecd-alsa-unmuter.service ${ROOT}/etc/systemd/system/multi-user.target.wants/livecd-talk.service"
  - "rm -rf ${ROOT}/etc/systemd/system/cloud-init.target.wants"
  - "rm -f ${ROOT}/usr/local/bin/choose-mirror ${ROOT}/usr/local/bin/Installation_guide ${ROOT}/usr/local/bin/livecd-sound"
  - "rm -f ${ROOT}/etc/motd"

  # --- the installer itself has no business on the installed system ----------
  - "rm -f ${ROOT}/etc/calamares/settings.conf"
  - "rm -rf ${ROOT}/etc/calamares/branding"
