# Calamares' stock users.conf, plus one group.
#
# Shipped in full rather than as a fragment because Calamares has no merge
# semantics here: a file in /etc/calamares/modules/ replaces the packaged one
# outright, so leaving anything out silently drops it. Everything above
# colony-firewall is byte-for-byte what calamares 3.4.2 ships.
#
# colony-firewall is what lets the person who just installed the machine answer
# their own firewall prompts. The control socket is group-owned, and without
# membership the UI autostarts into "permission denied" — which is exactly what
# the first real install did on 2026-08-21. Fixing it afterwards means usermod
# and a full logout, which is a poor first ten minutes.
#
# must_exist: false, because the group only exists once colony-firewall-control
# is installed, and an offline install may not have it. Calamares creates it
# either way; systemd-sysusers is happy to find it already there.
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - name: wheel
      must_exist: false
      system: true
    - audio
    - name: nopasswdlogin
      must_exist: false
      system: true
    - name: colony-firewall
      must_exist: false
      system: true

sudoersGroup:    wheel
autologinGroup:  autologin
sudoersConfigureWithGroup: false
setRootPassword: true
doReusePassword: false
displayAutologin:   false
doAutologin:     false
passwordRequirements:
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
allowWeakPasswords: false
