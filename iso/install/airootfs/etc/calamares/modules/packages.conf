# unpackfs copies the live filesystem wholesale, so the installer and its kiosk
# compositor land on the installed system too. Remove them: a distribution that
# ships its own installer on every machine it installs is untidy, and calamares
# pulls a Qt6 stack that an installed base system has no other use for.
---
backend: pacman

# update_db runs `pacman -Sy` inside the target before installing. It is not
# optional here: mkarchiso deletes /var/lib/pacman/sync from the image, so the
# installed system starts with no synchronisation database at all and every
# `pacman -S <pkg>` answers "target not found". Without this the entire package
# page — and the C++ patch written to make it usable — installs nothing, quietly,
# because failures in try_install are logged as warnings and never surfaced.
#
# It only takes effect when global storage says hasInternet, which is set by the
# welcome module's requirement check — hence `internet` had to go back into
# welcome.conf's check list. The two are useless apart.
update_db: true

pacman:
    num_retries: 1
    disable_download_timeout: true
    needed_only: false

operations:
    - remove:
        - calamares
        - cage
