# Which greeter to configure, in order of preference.
#
# Needed because the desktop profiles install one: archinstall's definitions each
# declare a default greeter — sddm for Plasma and Hyprland, lightdm for several of
# the window managers, gdm for GNOME. Calamares picks the first one in this list
# that is actually present on the target after the packages module has run.
#
# An install that selects no desktop installs no greeter, none of these is found,
# and the module does nothing — which is correct for a console-only system.
---
displaymanagers:
    - sddm
    - gdm
    - lightdm
    - lxdm

# Do not force a session: the greeter offers what is installed, and a user who
# picked two desktops should be able to choose between them at login.
defaultDesktopEnvironment:
    executable: ""
    desktopFile: ""

basicSetup: false
