# Give the target a working resolver before anything runs pacman inside it.
#
# /etc/resolv.conf in the live image is a symlink to
# /run/systemd/resolve/stub-resolv.conf. unpackfs copies the symlink; the mount
# module puts a fresh tmpfs on the target's /run; so inside the chroot the link
# points at nothing. networkcfg looks like it repairs this but does not —
# networkcfg/main.py copies with follow_symlinks=False, recreating the same dead
# link. And the packages module chroots with plain `chroot`, not `arch-chroot`,
# so it gets no bind-mounted resolv.conf either.
#
# The result is pacman answering "Could not resolve host" for every mirror, which
# looks like a second unrelated failure rather than a consequence of this one.
#
# Must run AFTER networkcfg, which would otherwise replace the file again, and
# BEFORE packages, which is the first thing to need DNS.
---
dontChroot: true
timeout: 60

script:
  - "/bin/sh -c 'rm -f ${ROOT}/etc/resolv.conf; cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf 2>/dev/null || :'"
