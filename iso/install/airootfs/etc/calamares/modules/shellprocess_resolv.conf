# Give the target a working resolver before anything runs pacman inside it.
#
# /etc/resolv.conf in the live image is a symlink to
# /run/systemd/resolve/stub-resolv.conf. unpackfs copies the symlink; the mount
# module puts a fresh tmpfs on the target's /run; so inside the chroot the link
# points at nothing. networkcfg looks like it repairs this but does not — it
# copies with follow_symlinks=False, recreating the same dead link. And the
# packages module chroots with plain `chroot`, not `arch-chroot`, so it gets no
# bind-mounted resolv.conf either.
#
# Dereferencing the symlink is NOT enough, and this is the trap: stub-resolv.conf
# contains `nameserver 127.0.0.53`, systemd-resolved's own local listener. Copied
# into the target it is a resolver that answers nothing, because resolved does not
# run in there. The file with real upstream nameservers is
# /run/systemd/resolve/resolv.conf, so that is preferred, and the dereferenced
# link is only a fallback for images that do not use resolved at all.
#
# Must run AFTER networkcfg, which would otherwise replace the file again, and
# BEFORE packages, which is the first thing to need DNS.
---
dontChroot: true
timeout: 60

script:
  - "/bin/sh -c 'rm -f ${ROOT}/etc/resolv.conf; if [ -s /run/systemd/resolve/resolv.conf ]; then cp /run/systemd/resolve/resolv.conf ${ROOT}/etc/resolv.conf; else cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf 2>/dev/null || :; fi'"
  - "/bin/sh -c 'grep -q \"^nameserver\" ${ROOT}/etc/resolv.conf 2>/dev/null && echo \"resolver: $(grep -m1 \"^nameserver\" ${ROOT}/etc/resolv.conf)\" || echo \"resolver: none — package installation will fail if anything was selected\"'"
