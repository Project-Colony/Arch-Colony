# Make pacman usable inside the target, before anything tries to run it.
#
# Two separate reasons it is not, both invisible until an install runs.
#
# 1. No resolver. /etc/resolv.conf in the live image is a symlink to
#    /run/systemd/resolve/stub-resolv.conf. unpackfs copies the symlink; the mount
#    module puts a fresh tmpfs on the target's /run; so inside the chroot the link
#    points at nothing. networkcfg looks like it repairs this but copies with
#    follow_symlinks=False, recreating the same dead link, and the packages module
#    chroots with plain `chroot` rather than `arch-chroot`, so it gets no
#    bind-mounted resolv.conf either.
#
#    Dereferencing the symlink is not enough: stub-resolv.conf contains
#    `nameserver 127.0.0.53`, systemd-resolved's own listener, which answers
#    nothing in a chroot where resolved does not run. The real upstream servers
#    are in /run/systemd/resolve/resolv.conf.
#
# 2. No mirrors. The mirrorlist shipped by pacman-mirrorlist has every Server line
#    commented out — verified in the built image, zero active entries. The live
#    session works because archiso fills its own copy in RAM at boot; the target
#    inherits the untouched file and pacman -Sy fails with "no servers configured
#    for repository". reflector.timer is enabled on the target, but a timer does
#    nothing for the first synchronisation, which happens during installation.
#
#    Two of Arch's official CDN endpoints are uncommented rather than written, so
#    the file keeps its comments and pacman's own placeholders survive untouched.
#    They are routed globally, which is what makes it defensible not to ask the
#    user for a country. reflector refines the list from there.
#
# NO SHELL VARIABLES BELOW, and that is not a style choice. Calamares substitutes
# its own variables into these strings before the shell ever sees them, and an
# unknown name is fatal: an earlier version wrote `echo "mirrors: $n active"` and
# the module refused to run at all with `Missing variables: QList("n", "n")`,
# taking the whole installation down at job 26 of 34. Anything shaped like $name
# belongs to Calamares here. Commands that may legitimately fail are prefixed with
# "-", which makes shellprocess ignore their exit status.
#
# Must run AFTER networkcfg, which would otherwise replace resolv.conf again, and
# BEFORE packages, which is the first module to need either of these.
---
dontChroot: true
timeout: 60

script:
  - "/bin/sh -c 'rm -f ${ROOT}/etc/resolv.conf; if [ -s /run/systemd/resolve/resolv.conf ]; then cp /run/systemd/resolve/resolv.conf ${ROOT}/etc/resolv.conf; else cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf 2>/dev/null || true; fi'"
  - "sed -i -e 's|^#Server = https://geo.mirror.pkgbuild.com|Server = https://geo.mirror.pkgbuild.com|' -e 's|^#Server = https://fastly.mirror.pkgbuild.com|Server = https://fastly.mirror.pkgbuild.com|' ${ROOT}/etc/pacman.d/mirrorlist"

  # Not tolerated: without a mirror, every later pacman call fails for a reason
  # that will not name itself. Better to stop here, where the cause is obvious.
  - "grep -q '^Server' ${ROOT}/etc/pacman.d/mirrorlist"

  # Tolerated, and logged either way: shellprocess records command output, so the
  # nameserver in use ends up in session.log without any shell substitution.
  - "-grep -m1 '^nameserver' ${ROOT}/etc/resolv.conf"
