# Make pacman usable inside the target, before anything tries to run it.
#
# Two separate reasons it is not, and both are invisible until an install runs.
#
# 1. No resolver. /etc/resolv.conf in the live image is a symlink to
#    /run/systemd/resolve/stub-resolv.conf. unpackfs copies the symlink; the mount
#    module puts a fresh tmpfs on the target's /run; so inside the chroot the link
#    points at nothing. networkcfg looks like it repairs this but copies with
#    follow_symlinks=False, recreating the same dead link, and the packages module
#    chroots with plain `chroot` rather than `arch-chroot`, so it gets no
#    bind-mounted resolv.conf either.
#
#    Dereferencing the symlink is not enough: stub-resolv.conf contains
#    `nameserver 127.0.0.53`, systemd-resolved's own listener, which answers
#    nothing in a chroot where resolved does not run. The real upstream servers
#    are in /run/systemd/resolve/resolv.conf.
#
# 2. No mirrors. /etc/pacman.d/mirrorlist as shipped by pacman-mirrorlist has
#    every Server line commented out — verified in the built image, zero active
#    entries. The live session works because archiso fills its own copy in RAM at
#    boot; the target inherits the untouched file and `pacman -Sy` fails with "no
#    servers configured for repository". reflector.timer is enabled on the target,
#    but a timer does not help the very first synchronisation, which happens
#    during installation.
#
#    Two mirrors are uncommented rather than written, so the file keeps its
#    comments and pacman's own $repo/$arch placeholders survive untouched. They
#    are Arch's official CDN endpoints, routed globally, so they work from
#    anywhere without asking the user to pick a country — which is the whole point
#    of choosing reflector over a region picker. reflector then refines the list on
#    its timer.
#
# Must run AFTER networkcfg, which would otherwise replace resolv.conf again, and
# BEFORE packages, which is the first module to need either of these.
---
dontChroot: true
timeout: 60

script:
  - "/bin/sh -c 'rm -f ${ROOT}/etc/resolv.conf; if [ -s /run/systemd/resolve/resolv.conf ]; then cp /run/systemd/resolve/resolv.conf ${ROOT}/etc/resolv.conf; else cp -L /etc/resolv.conf ${ROOT}/etc/resolv.conf 2>/dev/null || :; fi'"
  - "sed -i -e 's|^#Server = https://geo.mirror.pkgbuild.com|Server = https://geo.mirror.pkgbuild.com|' -e 's|^#Server = https://fastly.mirror.pkgbuild.com|Server = https://fastly.mirror.pkgbuild.com|' ${ROOT}/etc/pacman.d/mirrorlist"
  - "/bin/sh -c 'n=$(grep -c \"^Server\" ${ROOT}/etc/pacman.d/mirrorlist 2>/dev/null || echo 0); echo \"mirrors: $n active\"; [ \"$n\" -gt 0 ]'"
  - "/bin/sh -c 'grep -q \"^nameserver\" ${ROOT}/etc/resolv.conf 2>/dev/null && echo \"resolver: $(grep -m1 \"^nameserver\" ${ROOT}/etc/resolv.conf)\" || echo \"resolver: none — package installation will fail if anything was selected\"'"
