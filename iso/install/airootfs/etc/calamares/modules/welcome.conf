# Calamares ships demo entries in its default welcome.conf — "false", "snark" and
# notably "slow-true", a deliberately slow check used to exercise the UI. Inheriting
# that default leaves a user staring at a spinner for about two minutes before the
# Welcome page becomes usable. Observed on 2026-08-20 in QEMU.
#
# The two-minute stall this file was written to fix came from "slow-true", not from
# the internet check. That one is back: it is what sets hasInternet, which the
# packages module needs before it will synchronise pacman in the target.
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false

requirements:
    requiredStorage:  8.0
    requiredRam:      1.5
    internetCheckUrl: https://archlinux.org
    check:
        - storage
        - ram
        - power
        - root
        - screen
        # Checked, never required. Two reasons it must be in this list: it is the
        # only thing that sets hasInternet in global storage, and the packages
        # module needs that to run `pacman -Sy` in the target. Leaving it out made
        # the whole package selection page inert.
        - internet
    required:
        - storage
        - ram
        - root

geoip:
    style: none
