# Calamares ships demo entries in its default welcome.conf — "false", "snark" and
# notably "slow-true", a deliberately slow check used to exercise the UI. Inheriting
# that default leaves a user staring at a spinner for about two minutes before the
# Welcome page becomes usable. Observed on 2026-08-20 in QEMU.
#
# "internet" is not checked at all. The install copies the live filesystem and
# completes offline, so the answer changes nothing — but the check itself costs about
# ninety seconds on every boot before the Welcome page becomes usable, measured in
# QEMU on 2026-08-20. Ninety seconds of spinner to learn something we do not act on
# is a bad trade.
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false

requirements:
    requiredStorage:  8.0
    requiredRam:      1.5
    internetCheckUrl: https://archlinux.org
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style: none
