# The ESP is mounted at /boot, not at Calamares' upstream default of /boot/efi.
#
# With systemd-boot, Calamares runs `bootctl --path=<esp> install` and `kernel-install
# add`, which place the kernel and initramfs under the ESP. But Arch never touches the
# ESP afterwards: its only alpm hooks for this are mkinitcpio's, which write
# /boot/vmlinuz-linux-hardened and /boot/initramfs-linux-hardened.img on the root
# filesystem. There is no kernel-install alpm hook on Arch.
#
# So with the ESP at /boot/efi, the first `pacman -Syu` that bumps linux-hardened
# updates /usr/lib/modules but leaves the ESP holding the kernel from installation
# day. The next boot runs a kernel whose module tree no longer exists — no network,
# no storage, no graphics. It does not fail on installation day; it fails weeks later.
#
# Mounting the ESP at /boot puts both in the same place and lets Arch's own hooks keep
# it current. The cost is a larger ESP, hence the size below.
---
efiSystemPartition:     "/boot"
efiSystemPartitionSize:  1024MiB
efiSystemPartitionName: "COLONY_ESP"

userSwapChoices:
    - none
    - small
    - suspend

drawNestedPartitions:   false
alwaysShowPartitionLabels: true
defaultFileSystemType:  "ext4"

initialPartitioningChoice: none
initialSwapChoice: none
