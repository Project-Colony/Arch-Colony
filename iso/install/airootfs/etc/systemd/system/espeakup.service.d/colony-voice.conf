# The voice for the boot language: colony-live-setup writes default_voice=fr
# here for the French entries. espeakup.service sets an empty default_voice
# itself, and an EnvironmentFile= overrides Environment=. Read at start, so no
# daemon-reload is needed after the file appears; absent, espeakup keeps its
# default voice.
[Service]
EnvironmentFile=-/run/colony/espeakup.env
