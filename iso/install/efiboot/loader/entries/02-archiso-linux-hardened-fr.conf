# ASCII on purpose: systemd-boot draws with the firmware's font, and many
# firmwares have no glyph for an accented letter.
title    Support d'installation Arch Colony, francais (%ARCH%, UEFI)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% colony.lang=fr vconsole.keymap=fr
