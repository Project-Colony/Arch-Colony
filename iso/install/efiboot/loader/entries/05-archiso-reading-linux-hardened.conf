# Larger text and the dyslexia-friendly font together, for readers who need
# either: colony.textscale=1.4 is the design system's largest accessibility
# step, colony.font=dyslexic swaps the installer's font for OpenDyslexic, and
# ter-v22b is the console's Terminus at about 1.4 times its default height.
# Either can be removed at the boot menu (press e).
title    Arch Colony install medium, English, large text and OpenDyslexic (%ARCH%, UEFI)
sort-key 05
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-hardened
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-hardened.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% colony.lang=en colony.textscale=1.4 colony.font=dyslexic vconsole.font=ter-v22b
